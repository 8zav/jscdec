  <text x="395" y="178" fill="#f5f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-4">jsc<tspan fill="#8b7cff">dec</tspan></text>
  <text x="402" y="226" fill="#c8d0e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">V8 / Bytenode / Electron Bytecode Decompiler</text>
  <text x="405" y="270" fill="#929dbb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Reconstruct readable JavaScript from V8 Ignition bytecode.</text>
