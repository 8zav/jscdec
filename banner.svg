<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">jscdec — V8 Bytecode Decompiler</title>
  <desc id="desc">A dark technical banner for jscdec, a JavaScript decompiler for V8 and Electron JSC files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="1" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b4bff"/>
      <stop offset="1" stop-color="#00c2ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="170" cy="80" r="120" fill="#563cff" opacity=".22" filter="url(#blur)"/>
  <circle cx="1230" cy="290" r="150" fill="#007dff" opacity=".16" filter="url(#blur)"/>
  <path d="M0 280 C280 190 380 390 700 250 S1120 120 1400 210" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".55"/>
  <path d="M0 310 C300 220 450 400 760 275 S1130 160 1400 245" fill="none" stroke="#725cff" stroke-width="1" opacity=".35"/>
  <g fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 132 L155 180 L205 228"/>
    <path d="M295 132 L345 180 L295 228"/>
    <path d="M270 118 L230 242"/>
